version: "3.8"

services:
  rag-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic-rag-platform
    ports:
      - "8000:8000"
    environment:
      - VECTOR_BACKEND=chroma
      - CHROMA_PERSIST_DIR=/app/vector_db
      - FEEDBACK_DB_PATH=/app/vector_db/feedback.db
      - BM25_PERSIST_PATH=/app/vector_db/bm25_index.pkl
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - RERANKER_MODEL=cross-encoder/ms-marco-MiniLM-L-6-v2
    volumes:
      - rag_data:/app/vector_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: agentic-rag-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    depends_on:
      - rag-platform

volumes:
  rag_data:
    driver: local
  prometheus_data:
    driver: local
